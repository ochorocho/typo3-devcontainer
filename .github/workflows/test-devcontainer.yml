name: Test DevContainer

on:
  push:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'config/**'
      - '.env'
      - 'Caddyfile'
      - 'composer.json'
  pull_request:
    branches: [main]
    paths:
      - '.devcontainer/**'
      - 'config/**'
      - '.env'
      - 'Caddyfile'
      - 'composer.json'

jobs:
  test-devcontainer:
    runs-on: ubuntu-latest
    timeout-minutes: 30
    steps:
      - name: Checkout
        uses: actions/checkout@v4
        with:
          submodules: true

      - name: Setup Node.js
        uses: actions/setup-node@v4
        with:
          node-version: '22'

      - name: Install devcontainer CLI
        run: npm install -g @devcontainers/cli

      - name: Build and start devcontainer
        run: devcontainer up --workspace-folder .

      - name: Run tests
        run: devcontainer exec --workspace-folder . bash .devcontainer/tests/run-tests.sh

      - name: Cleanup
        if: always()
        run: docker compose -f .devcontainer/docker-compose.yml down -v
